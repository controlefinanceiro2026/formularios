<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Consulta — Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #f1f5f9; }
        .fp-hero {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            color: white; padding: 2.5rem 1.5rem; text-align: center;
        }
        .fp-hero h1 { margin: 0 0 0.5rem; font-size: 1.6rem; }
        .fp-hero p { margin: 0 auto; opacity: 0.9; max-width: 460px; }
        .fp-container { max-width: 420px; margin: -2rem auto 3rem; padding: 0 1rem; }
        .fp-card { background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 2rem; }
        .fp-msg { padding: 0.9rem 1rem; border-radius: 8px; margin-top: 1rem; font-size: 0.9rem; display: none; }
        .fp-msg.erro { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    </style>
</head>
<body>
    <div class="fp-hero">
        <h1>🔒 Painel de Consulta</h1>
        <p>Acesso restrito — Formulários, Cadastro Rápido, Cadastro de Pessoal e Cadastro de Veículos.</p>
    </div>

    <div class="fp-container">
        <div class="fp-card">
            <form id="form-login">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="login-email" placeholder="seu@email.com" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="login-senha" required autocomplete="current-password">
                </div>
                <div id="login-mensagem" class="fp-msg"></div>
                <button type="submit" class="btn-primary" style="width:100%; margin-top:1rem; padding:0.85rem;" id="login-btn-entrar">Entrar</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="login.js"></script>
</body>
</html>
